[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*", "staticfiles"]

[tool.ruff.lint]
# pyflakes, real pycodestyle errors, and sorted imports
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["core", "notifications", "payments", "quicksurf", "rewards", "services", "users", "wallets"]

[tool.coverage.run]
source = ["core", "notifications", "payments", "quicksurf", "rewards", "services", "users", "wallets"]
omit = ["*/migrations/*", "*/tests.py", "quicksurf/asgi.py", "quicksurf/wsgi.py"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
